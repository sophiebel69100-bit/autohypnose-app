<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon espace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ivoire: #F8F4EC;
    --panel: #FFFDF8;
    --lavande: #8C7BA6;
    --lavande-fonce: #5B4C72;
    --lavande-pale: #E9E3F2;
    --or: #B8935A;
    --texte: #322B38;
    --texte-doux: #6B6274;
    --erreur: #A6543F;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ivoire); color: var(--texte);
    font-family: 'Work Sans', sans-serif; min-height: 100vh; line-height: 1.55;
  }
  h1, h3 { font-family: 'Fraunces', serif; font-weight: 500; margin: 0; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 60px 24px 80px; }
  .hero { text-align: center; padding: 24px 0 36px; }
  .breath {
    width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--lavande-pale), var(--lavande) 75%);
    box-shadow: 0 0 0 1px var(--or) inset; animation: pulse 4.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: 0.85; } 50% { transform: scale(1.08); opacity: 1; } }
  .breath.actif { animation-duration: 4.5s; }
  .hero h1 { font-size: 26px; color: var(--lavande-fonce); }
  .hero p { color: var(--texte-doux); font-size: 15px; margin-top: 8px; }
  .card { background: var(--panel); border: 1px solid #EDE6F4; border-radius: var(--radius); padding: 26px; margin-bottom: 20px; }
  .card.center { text-align: center; }
  .card h3 { font-size: 18px; margin-bottom: 4px; }
  .card .desc { color: var(--texte-doux); font-size: 13.5px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; text-align: left; }
  label { display: block; font-size: 13.5px; font-weight: 500; margin-bottom: 6px; }
  input[type=text], textarea {
    width: 100%; border: 1px solid #DED4E8; border-radius: 10px; padding: 11px 13px;
    font-family: 'Work Sans', sans-serif; font-size: 14.5px; background: #FFFEFC; color: var(--texte); resize: vertical;
  }
  input[type=text].code-input { text-transform: uppercase; text-align: center; letter-spacing: 2px; }
  textarea { min-height: 140px; }
  input:focus, textarea:focus { outline: none; border-color: var(--lavande); box-shadow: 0 0 0 3px var(--lavande-pale); }
  button.primary {
    background: var(--lavande-fonce); color: #FBF8FF; border: none; border-radius: 10px;
    padding: 12px 20px; font-family: 'Work Sans', sans-serif; font-size: 14.5px; font-weight: 500; cursor: pointer;
    transition: background 0.15s ease; width: 100%;
  }
  button.primary:hover:not(:disabled) { background: var(--lavande); }
  button.primary:disabled { background: #C9C0D4; cursor: not-allowed; }
  .error { background: #FBEEEA; border: 1px solid #E9C9BC; color: var(--erreur); padding: 11px 14px; border-radius: 10px; font-size: 13.5px; margin-top: 12px; }
  .success { background: #F1EEF8; border: 1px solid var(--lavande-pale); color: var(--lavande-fonce); padding: 14px; border-radius: 10px; font-size: 14px; margin-top: 12px; text-align: center; }
  audio { width: 100%; margin-top: 10px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .client-greet { font-size: 20px; color: var(--lavande-fonce); margin-bottom: 6px; }
  .client-sub { color: var(--texte-doux); font-size: 14px; margin-bottom: 24px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="breath" id="breath"></div>
    <h1 id="titre">Mon espace</h1>
    <p id="sousTitre">Entre ton code personnel.</p>
  </div>

  <div class="card center" id="cardAccess">
    <div class="field">
      <label for="accessCode">Ton code personnel</label>
      <input type="text" class="code-input" id="accessCode" placeholder="ex. A3F9K2">
    </div>
    <button class="primary" onclick="accederEspace()" id="btnAccess">Accéder à mon espace</button>
    <div id="accessError"></div>
  </div>

  <div id="espaceClient" style="display:none">

    <div class="card center" id="cardAudio" style="display:none">
      <div class="client-greet" id="clientGreet"></div>
      <div class="client-sub">Installe-toi confortablement, dans un endroit calme, avant de démarrer.</div>
      <audio id="clientAudio" controls></audio>
    </div>

    <div class="card">
      <h3>Ton journal</h3>
      <div class="desc">Écris librement ce que tu ressens, entre deux séances.</div>
      <div class="field">
        <textarea id="entryText" placeholder="Écris librement ce que tu ressens, ce qui s'est passé, ce qui t'a marqué..."></textarea>
      </div>
      <button class="primary" onclick="envoyerEntree()" id="btnSend">Envoyer</button>
      <div id="entryError"></div>
      <div id="entrySuccess"></div>
    </div>

  </div>

</div>

<script>
let codeActuel = '';

async function accederEspace() {
  const btn = document.getElementById('btnAccess');
  const code = document.getElementById('accessCode').value.trim().toUpperCase();
  document.getElementById('accessError').innerHTML = '';
  if (!code) { document.getElementById('accessError').innerHTML = '<div class="error">Entre ton code personnel.</div>'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Recherche...';

  codeActuel = code;

  try {
    const res = await fetch('/.netlify/functions/get-session?code=' + encodeURIComponent(code));
    if (res.ok) {
      const data = await res.json();
      document.getElementById('clientGreet').textContent = `Bonjour ${data.clientName}`;
      const audioEl = document.getElementById('clientAudio');
      audioEl.src = data.audio;
      audioEl.onplay = () => document.getElementById('breath').className = 'breath actif';
      audioEl.onpause = () => document.getElementById('breath').className = 'breath';
      audioEl.onended = () => document.getElementById('breath').className = 'breath';
      document.getElementById('cardAudio').style.display = 'block';
    }
  } catch (err) {
    // pas d'audio disponible pour ce code, on ignore et on affiche quand même le journal
  }

  document.getElementById('cardAccess').style.display = 'none';
  document.getElementById('titre').textContent = 'Mon espace';
  document.getElementById('sousTitre').textContent = '';
  document.getElementById('espaceClient').style.display = 'block';

  btn.disabled = false;
  btn.textContent = 'Accéder à mon espace';
}

async function envoyerEntree() {
  const btn = document.getElementById('btnSend');
  const text = document.getElementById('entryText').value.trim();
  document.getElementById('entryError').innerHTML = '';
  document.getElementById('entrySuccess').innerHTML = '';

  if (!text) { document.getElementById('entryError').innerHTML = '<div class="error">Écris quelque chose avant d\'envoyer.</div>'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Envoi...';
  try {
    const res = await fetch('/.netlify/functions/save-journal-entry', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: codeActuel, text })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur inconnue');

    document.getElementById('entryText').value = '';
    document.getElementById('entrySuccess').innerHTML = '<div class="success">Merci de ta confiance. Tu peux écrire ici tout ce qui te passe par la tête et qui te fait du bien.</div>';
  } catch (err) {
    document.getElementById('entryError').innerHTML = '<div class="error">L\'envoi a échoué : ' + err.message + '</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Envoyer';
  }
}
</script>
</body>
</html>
