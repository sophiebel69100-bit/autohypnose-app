<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre séance d'auto-hypnose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ivoire: #F8F4EC;
    --panel: #FFFDF8;
    --lavande: #8C7BA6;
    --lavande-fonce: #5B4C72;
    --lavande-pale: #E9E3F2;
    --or: #B8935A;
    --texte: #322B38;
    --texte-doux: #6B6274;
    --erreur: #A6543F;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ivoire); color: var(--texte);
    font-family: 'Work Sans', sans-serif; min-height: 100vh; line-height: 1.55;
  }
  h1, h3 { font-family: 'Fraunces', serif; font-weight: 500; margin: 0; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 60px 24px 80px; }
  .hero { text-align: center; padding: 24px 0 36px; }
  .breath {
    width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--lavande-pale), var(--lavande) 75%);
    box-shadow: 0 0 0 1px var(--or) inset; animation: pulse 4.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: 0.85; } 50% { transform: scale(1.08); opacity: 1; } }
  .breath.actif { animation-duration: 4.5s; }
  .hero h1 { font-size: 26px; color: var(--lavande-fonce); }
  .hero p { color: var(--texte-doux); font-size: 15px; margin-top: 8px; }
  .card { background: var(--panel); border: 1px solid #EDE6F4; border-radius: var(--radius); padding: 26px; margin-bottom: 20px; text-align: center; }
  .card h3 { font-size: 18px; margin-bottom: 4px; }
  .card .desc { color: var(--texte-doux); font-size: 13.5px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; text-align: left; }
  label { display: block; font-size: 13.5px; font-weight: 500; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; border: 1px solid #DED4E8; border-radius: 10px; padding: 11px 13px;
    font-family: 'Work Sans', sans-serif; font-size: 14.5px; background: #FFFEFC; color: var(--texte);
    text-transform: uppercase; text-align: center; letter-spacing: 2px;
  }
  input:focus { outline: none; border-color: var(--lavande); box-shadow: 0 0 0 3px var(--lavande-pale); }
  button.primary {
    background: var(--lavande-fonce); color: #FBF8FF; border: none; border-radius: 10px;
    padding: 12px 20px; font-family: 'Work Sans', sans-serif; font-size: 14.5px; font-weight: 500; cursor: pointer;
    transition: background 0.15s ease; width: 100%;
  }
  button.primary:hover:not(:disabled) { background: var(--lavande); }
  button.primary:disabled { background: #C9C0D4; cursor: not-allowed; }
  .error { background: #FBEEEA; border: 1px solid #E9C9BC; color: var(--erreur); padding: 11px 14px; border-radius: 10px; font-size: 13.5px; margin-top: 12px; }
  audio { width: 100%; margin-top: 10px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .client-greet { font-size: 20px; color: var(--lavande-fonce); margin-bottom: 6px; }
  .client-sub { color: var(--texte-doux); font-size: 14px; margin-bottom: 24px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="breath" id="breath"></div>
    <h1>Votre séance</h1>
    <p>Entrez le code transmis par votre praticienne.</p>
  </div>

  <div class="card" id="cardAccess">
    <div class="field">
      <label for="accessCode">Code d'accès</label>
      <input type="text" id="accessCode" placeholder="ex. A3F9K2">
    </div>
    <button class="primary" onclick="accederSeance()" id="btnAccess">Accéder à ma séance</button>
    <div id="clientError"></div>
  </div>

  <div class="card" id="clientSession" style="display:none">
    <div class="client-greet" id="clientGreet"></div>
    <div class="client-sub">Installez-vous confortablement, dans un endroit calme, avant de démarrer.</div>
    <audio id="clientAudio" controls></audio>
  </div>

</div>

<script>
async function accederSeance() {
  const btn = document.getElementById('btnAccess');
  const code = document.getElementById('accessCode').value.trim().toUpperCase();
  document.getElementById('clientError').innerHTML = '';
  if (!code) { document.getElementById('clientError').innerHTML = '<div class="error">Entrez votre code d\'accès.</div>'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Recherche...';
  try {
    const res = await fetch('/.netlify/functions/get-session?code=' + encodeURIComponent(code));
    const data = await res.json();
    if (!res.ok) throw new Error('not found');

    document.getElementById('clientGreet').textContent = `Bonjour ${data.clientName}`;
    const audioEl = document.getElementById('clientAudio');
    audioEl.src = data.audio;
    audioEl.onplay = () => document.getElementById('breath').className = 'breath actif';
    audioEl.onpause = () => document.getElementById('breath').className = 'breath';
    audioEl.onended = () => document.getElementById('breath').className = 'breath';
    document.getElementById('cardAccess').style.display = 'none';
    document.getElementById('clientSession').style.display = 'block';
  } catch (err) {
    document.getElementById('clientError').innerHTML = '<div class="error">Code introuvable. Vérifiez-le auprès de votre praticienne.</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Accéder à ma séance';
  }
}
</script>
</body>
</html>
